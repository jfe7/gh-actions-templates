name: Pull Request Validation

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  linter:
    name: 'Linter'
    uses: ./.github/workflows/template-linter.yaml
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  template_validation:
    name: 'Template Validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check File Case in .github/**
        run: |
          errors=0

          while read -r file; do
            base="$(basename "$file")"

            if [[ "$base" == *PULL_REQUEST_TEMPLATE* ]]; then
              continue
            fi

            lowercase="$(echo "$base" | tr '[:upper:]' '[:lower:]')"
            if [ "$base" != "$lowercase" ]; then
              echo "🚫 File not lowercase: $file"
              errors=$((errors + 1))
            fi
          done < <(find . -depth -type f)

          if [ "$errors" -ne 0 ]; then
            echo "❌ Found $errors file(s) with uppercase letters."
            exit 1
          else
            echo "✅ All filenames are lowercase."
            exit 0
          fi
        working-directory: .github

      - name: Check File Patterns in .github/**
        run: |
          errors=0

          while read -r file; do
            base="$(basename "$file")"

            # Check for allowed filename patterns
            if [[ "$base" == action.yml || "$base" == *.yaml || "$base" == .* || "$base" == template-* || "$base" == workflow-* || "$base" == *.md ]]; then
              echo "✅ Valid filename pattern: $file"
              continue
            else
              echo "🚫 Invalid filename pattern: $file"
              errors=$((errors + 1))
            fi
          done < <(find . -depth -type f)

          if [ "$errors" -gt 0 ]; then
            echo "❌ Found $errors file(s) that don't match allowed patterns."
            exit 1
          else
            echo "✅ All filenames match allowed patterns."
            exit 0
          fi
        working-directory: .github

      - name: Check Examples
        run: |
          shopt -s nullglob # Prevent literal glob expansion if no matches
          errors=0

          for file in "$WORKFLOWS_DIR"/template-*.yaml "$WORKFLOWS_DIR"/workflow-*.yaml; do
            # Get Base Name.
            echo "⚙️ Processing file : $file"
            base_name=$(basename "$file" .yaml)

            # Construct Expected Example Path.
            if [[ "$base_name" == workflow-* ]]; then
              md_file="$WORKFLOWS_EXAMPLES_DIR/${base_name}.md"
            elif [[ "$base_name" == template-* ]]; then
              md_file="$TEMPLATES_EXAMPLES_DIR/${base_name}.md"
            fi

            # Check If Example MD Exists.
            if [ ! -f "$md_file" ]; then
              echo "🚫 Example file not found : $md_file"
              errors=$((errors + 1))
            else
              echo "✅ Example file found : $md_file"
            fi
          done

          for folder in "$ACTIONS_DIR"/*/; do
            # Get Base Name.
            echo "📁 Processing folder : $folder"
            base_name=$(basename "$folder")

            # Construct Expected Example Path.
            md_file="$ACTIONS_EXAMPLES_DIR/${base_name}.md"

            # Check If Example MD Exists.
            if [ ! -f "$md_file" ]; then
              echo "🚫 Example file not found : $md_file"
              errors=$((errors + 1))
            else
              echo "✅ Example file found : $md_file"
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo "❌ Found $errors templates that require example files."
            exit 1
          else
            echo "✅ All templates have example files!"
            exit 0
          fi
        env:
          WORKFLOWS_DIR: .github/workflows
          WORKFLOWS_EXAMPLES_DIR: examples/workflows
          TEMPLATES_EXAMPLES_DIR: examples/templates
          ACTIONS_DIR: .github/actions
          ACTIONS_EXAMPLES_DIR: examples/actions

  git_versioning:
    name: 'Git Versioning'
    uses: ./.github/workflows/template-git-versioning.yaml
    with:
      dry_run: true
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
